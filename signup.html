<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgerizza | Login & Sign Up</title>
    <link rel="stylesheet" href="./assets/css/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- ========== DARK MODE TOGGLE SECTION ========== -->
    <section class="toggle-section">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div id="darkToggle" class="dark-toggle"><i class="fas fa-moon"></i></div>
                </div>
            </div>
        </div>
    </section>
    <!-- ========== END DARK MODE TOGGLE SECTION ========== -->

    <!-- ========== MAIN AUTH SECTION ========== -->
    <section class="auth-section">
        <div class="container">

            <!-- ===== LOGO ROW ===== -->
            <div class="row">
                <div class="col">
                    <div class="logo">Burger<span>izza</span></div>
                </div>
            </div>
            <!-- ===== END LOGO ROW ===== -->

            <!-- ===== TABS ROW ===== -->
            <div class="row">
                <div class="col">
                    <div class="tabs">
                        <div id="loginTab" class="tab active">Log In</div>
                        <div id="signupTab" class="tab">Sign Up</div>
                    </div>
                </div>
            </div>
            <!-- ===== END TABS ROW ===== -->

            <!-- ===== LOGIN FORM ROW ===== -->
            <div class="row">
                <div class="col">
                    <form id="loginForm" class="active">

                        <!-- Email Field -->
                        <div class="row">
                            <div class="col">
                                <label for="loginEmail">Email</label>
                                <div class="input-wrapper">
                                    <i class="far fa-envelope"></i>
                                    <input type="email" id="loginEmail" placeholder="Enter your email" title="Email address" required>
                                </div>
                            </div>
                        </div>
                        <!-- End Email Field -->

                        <!-- Password Field -->
                        <div class="row">
                            <div class="col">
                                <label for="loginPassword">Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" id="loginPassword" placeholder="Enter your password" title="Password" required>
                                    <i id="toggleLogin" class="fas fa-eye toggle" type="button" title="Show or hide password"></i>
                                </div>
                            </div>
                        </div>
                        <!-- End Password Field -->

                        <!-- Options Row (Remember Me + Forgot Password) -->
                        <div class="row">
                            <div class="col">
                                <div class="options-row">
                                    <label><input type="checkbox" id="rememberMe"> Remember me</label>
                                    <a href="#">Forgot Password?</a>
                                </div>
                            </div>
                        </div>
                        <!-- End Options Row -->

                        <!-- Submit Button -->
                        <div class="row">
                            <div class="col">
                                <button type="submit" class="btn">Log In</button>
                            </div>
                        </div>
                        <!-- End Submit Button -->

                    </form>
                </div>
            </div>
            <!-- ===== END LOGIN FORM ROW ===== -->

            <!-- ===== SIGNUP FORM ROW ===== -->
            <div class="row">
                <div class="col">
                    <form id="signupForm">

                        <!-- Name Field -->
                        <div class="row">
                            <div class="col">
                                <label for="signupName">Name</label>
                                <div class="input-wrapper">
                                    <i class="far fa-user"></i>
                                    <input type="text" id="signupName" placeholder="Enter your full name" title="Full name" required>
                                </div>
                            </div>
                        </div>
                        <!-- End Name Field -->

                        <!-- Email Field -->
                        <div class="row">
                            <div class="col">
                                <label for="signupEmail">Email</label>
                                <div class="input-wrapper">
                                    <i class="far fa-envelope"></i>
                                    <input type="email" id="signupEmail" placeholder="Enter your email" title="Email address" required>
                                </div>
                                <div id="emailError" class="error"></div>
                            </div>
                        </div>
                        <!-- End Email Field -->

                        <!-- Password Field -->
                        <div class="row">
                            <div class="col">
                                <label for="signupPassword">Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" id="signupPassword" placeholder="Enter your password" title="Password" required>
                                    <i id="toggleSignup" class="fas fa-eye toggle" type="button" title="Show or hide password"></i>
                                </div>
                                <div id="passwordError" class="error"></div>
                            </div>
                        </div>
                        <!-- End Password Field -->

                        <!-- Re-type Password Field -->
                        <div class="row">
                            <div class="col">
                                <label for="signupRePassword">Re-type Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" id="signupRePassword" placeholder="Re-enter your password" title="Re-type Password" required>
                                    <i id="toggleRePassword" class="fas fa-eye toggle" type="button" title="Show or hide password"></i>
                                </div>
                                <div id="rePasswordError" class="error"></div>
                            </div>
                        </div>
                        <!-- End Re-type Password Field -->

                        <!-- Submit Button -->
                        <div class="row">
                            <div class="col">
                                <button type="submit" class="btn">Sign Up</button>
                            </div>
                        </div>
                        <!-- End Submit Button -->

                    </form>
                </div>
            </div>
            <!-- ===== END SIGNUP FORM ROW ===== -->

            <!-- ===== BACK BUTTON ROW ===== -->
            <div class="row">
                <div class="col">
                    <div class="back">
                        <a href="./index.html">
                            <button type="button" class="btn back-btn">← Back</button>
                        </a>
                    </div>
                </div>
            </div>
            <!-- ===== END BACK BUTTON ROW ===== -->

        </div>
    </section>
    <!-- ========== END MAIN AUTH SECTION ========== -->

    <script src="./assets/js/signup.js"></script>
</body>
</html>
