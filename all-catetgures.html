<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Website Title -->
    <title>Burgerizza</title>
    <!-- Bootstrap 5 CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- * web fonts -->
    <link rel="stylesheet" href="assets/css/all.min.css">
    <!-- ! Main Style file -->
    <link rel="stylesheet" href="assets/css/all-catetgures.css">
</head>

<body>
    <section>
        <div class="container py-5">
            <!-- ! back to home (Start) -->
            <div class="clik-to-home">
                <div class="row">
                    <div class="col-12 d-flex gap-3 align-items-center">
                        <div class="back ">
                            <a href="./index.html" class="text-decoration-none text-white"><i
                                    class="fa-solid fa-angle-left"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ! back to home (End) -->

            <!-- Main Bar (Start) -->
            <div class="main-bar">
                <div class="row">
                    <div class="col-12">
                        <h2 class="text-center mb-4">Our Menu</h2>
                        <ul class="nav nav-pills justify-content-center mb-4">
                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#all">All</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#burger">Burgers</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pizza">Pizza</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pasta">Pasta</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#hot-dog">Hot
                                    Dog</button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Bar (End) -->


            <!-- * All Categoure (Start) -->
            <div class="tab-content">
                <div class="tab-pane fade show active" id="all">
                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">Classic Burger</h5>
                                    <p class="price">$8.99</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title ">Pepperoni Pizza</h5>
                                    <p class="price">$12.50</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">Italian Pasta</h5>
                                    <p class="price">$10.00</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- BURGER -->
                <div class="tab-pane fade" id="burger">
                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">Classic Burger</h5>
                                    <p class="price">$8.99</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PIZZA -->
                <div class="tab-pane fade" id="pizza">
                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">Pepperoni Pizza</h5>
                                    <p class="price">$12.50</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PASTA -->
                <div class="tab-pane fade" id="pasta">
                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">Italian Pasta</h5>
                                    <p class="price">$10.00</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="hot-dog">
                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4">
                            <div class="card">
                                <img src="assets/images/Pizza.jpg" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">Hot Dog</h5>
                                    <p class="price">$10.00</p>
                                    <button class="btn btn-custom w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- * All Categoure (End) -->

    </section>
    <!-- Bootstrap JS -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
